services:
  # ── FastAPI Web Service ────────────────────────────────────────────────────
  - type: web
    name: alpha-lens-v2
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: ADE_ENDPOINT
        value: https://api.va.landing.ai/v1/ade
      - key: DEBUG
        value: "False"
      - key: HOST
        value: 0.0.0.0
      # Secrets — set these manually in Render Dashboard
      - key: VISION_AGENT_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: UPSTASH_REDIS_URL
        sync: false
      - key: FINNHUB_API_KEY
        sync: false
      # Set this AFTER Vercel deploys (your Vercel URL)
      - key: FRONTEND_URL
        sync: false

  # ── ARQ Background Worker ──────────────────────────────────────────────────
  - type: worker
    name: alpha-lens-v2-worker
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: arq worker.WorkerSettings
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: ADE_ENDPOINT
        value: https://api.va.landing.ai/v1/ade
      - key: DEBUG
        value: "False"
      # Secrets — same values as web service
      - key: VISION_AGENT_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: UPSTASH_REDIS_URL
        sync: false
