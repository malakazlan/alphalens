# AlphaLens production stack — runs on anorra-prod alongside (but isolated from)
# the existing Anorra stack.
#
# Isolation rules:
#   - dedicated network alphalens_net on 172.30.0.0/16 (Anorra is on 172.20.0.0/16)
#   - container names prefixed alphalens_*
#   - no ports bound to host — public traffic enters via cloudflared tunnel
#   - resource limits prevent a runaway from starving Anorra
#
# Bring up:
#   docker compose --env-file /opt/alphalens/.env up -d --build
#
# Tear down (does NOT touch Anorra):
#   docker compose --env-file /opt/alphalens/.env down

services:
  alphalens-web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    image: alphalens-web:latest
    container_name: alphalens_web
    restart: unless-stopped
    env_file:
      - /opt/alphalens/.env
    environment:
      # Set by deploy.sh from `git rev-parse --short HEAD`. Overrides any
      # SENTRY_RELEASE in .env so the running container always reflects the
      # commit it was built from.
      - SENTRY_RELEASE=${SENTRY_RELEASE:-}
    networks:
      - alphalens_net
    expose:
      - "8001"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8001/livez"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    mem_limit: 1g
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  alphalens-worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.worker
    image: alphalens-worker:latest
    container_name: alphalens_worker
    restart: unless-stopped
    depends_on:
      alphalens-web:
        condition: service_healthy
    env_file:
      - /opt/alphalens/.env
    environment:
      - SENTRY_RELEASE=${SENTRY_RELEASE:-}
    command: ["arq", "worker.WorkerSettings"]
    networks:
      - alphalens_net
    mem_limit: 2g
    cpus: 2.0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: alphalens_cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - alphalens_net
    depends_on:
      alphalens-web:
        condition: service_healthy
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

networks:
  alphalens_net:
    name: alphalens_net
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/16
